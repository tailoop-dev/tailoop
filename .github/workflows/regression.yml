name: Regression
# Request id
run-name: Regression ${{ github.event.client_payload.version || inputs.version || 'latest' }} ${{ github.event.client_payload.request }}

on:
  # Sent for every Tailoop release, and every Monday for the newest one.
  repository_dispatch:
    types: [tailoop-released]
  workflow_dispatch:
    inputs:
      version:
        description: "Tailoop version to test: latest, or a release such as 1.0.0"
        default: latest

permissions:
  contents: read

concurrency:
  group: regression
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-24.04
    environment: public-regression
    timeout-minutes: 30
    env:
      TAILOOP_VERSION: ${{ github.event.client_payload.version || inputs.version || 'latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Tailoop
        env:
          TAILOOP_INDEX_URL: ${{ secrets.TAILOOP_INDEX_URL }}
        run: bash scripts/install-tailoop.sh

      - name: Run the suite
        env:
          OPENAI_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.LLM_API_BASE }}
          TEST_SECRET_PASSWORD: ${{ secrets.TEST_SECRET_PASSWORD }}
        # A FAIL verdict exits 1 and is expected here; the next step judges it.
        run: |
          tailoop run --directory tests --config tailoop.yaml \
            --report-format json --report-format junit --save-dir results \
            || test $? -eq 1

      - name: Check verdicts
        run: python scripts/check_verdicts.py results

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results
          path: results/
          retention-days: 14
