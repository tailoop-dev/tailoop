# The configuration the regression suite runs with.
llm:
  model: "gpt-6-luna"

# Every tool Tailoop uses comes from an MCP server listed here.
mcp_servers:
  chromedevtools:
    enabled: true
    description: "Chrome browser control: navigate pages, click and fill elements, take page snapshots and screenshots."
    executor_guidance: |
      UIDs come from the latest snapshot and go stale after any navigation;
      take a fresh snapshot rather than reusing one from before a page change.
      A click can report success without the page reacting. If the page has not
      changed, click the element with evaluate_script instead of clicking again.
    command: "npx"
    args:
      - "-y"
      - "chrome-devtools-mcp@~1.12.0"
      - "--no-page-id-routing"
      # A CI runner has no display.
      - "--headless=true"
      - "--isolated"
      # Chrome's sandbox needs kernel features CI machines often lack.
      - "--chrome-arg=--no-sandbox"
      - "--chrome-arg=--disable-dev-shm-usage"
      # Chrome's leaked-password warning takes all clicks and typing after a login
      # while the tools still report success; this blocks only that check.
      - "--chrome-arg=--host-resolver-rules=MAP passwordsleakcheck-pa.googleapis.com ~NOTFOUND"
      - "--no-usage-statistics"
      - "--no-performance-crux"
    transport: "stdio"

  filesystem:
    enabled: true
    description: "Files in the fixtures folder: expected values that tests compare the application against."
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem@2.1.0"
      - "./fixtures"
    transport: "stdio"
